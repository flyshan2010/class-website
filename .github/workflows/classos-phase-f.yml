name: ClassOS Phase F 工具

# 學年升級精靈的批次操作入口（SPEC_學年升級 §3：走 Node ＋ Notion 官方 API）。
# 僅手動觸發，且預設 dry-run —— 要實際寫入必須明確把 mode 選成 execute。
# NOTION_TOKEN 只存在 GitHub Secret，不外流（Token 持有原則見 SPEC §3）。
on:
  workflow_dispatch:
    inputs:
      task:
        description: 要執行的任務
        required: true
        type: choice
        options:
          - "[常用] f29-settle-week-rewards（補結某一週的獎懲入帳，需填 week；f24 只試算不入帳）"
          - "[常用] f03-backfill-year（回填學年，同步被護欄擋下時跑這支）"
          - "[常用] f27-prune-dangling-relations（清死關聯・只做學生名冊・可填 seat 單人試跑）"
          - "[常用] f28-prune-dangling-relations-all（清死關聯・全庫 27 個庫，含名冊）"
          - "[半常用] f21-relink-daily-plan（大批調課後重掛單元 relation）"
          - "[驗收用] f05-test-failloud（證明學年為空會擋同步）"
          - "[驗收用] f12-simulate-skill-writes（9 支 skill 學年寫入模擬）"
          - "[升級用・2027-06] f10-sandbox（沙盒建置／拆除）"
          - "[升級用・2027-06] f11-upgrade-wizard（學年升級精靈）"
          - "[一次性・已完成・別再跑] f01-purge-test-data"
          - "[一次性・已完成・別再跑] f02-add-year-field"
          - "[一次性・已完成・別再跑] f04-unpublish-mock-reports"
          - "[一次性・已完成・會覆寫老師改過的聯絡簿] f13-fill-contactbook"
          - "[一次性・已完成・別再跑] f14-purge-mock-data"
          - "[一次性・已完成・會蓋掉 Notion 最新進度] f20-import-daily-plan"
          - "[一次性・已完成・別再跑] f22-renumber-review-rounds"
          - "[一次性・已完成・別再跑] f25-clear-weekly-mock"
          - "[一次性・已完成・別再跑] f26-clear-weekly-focus"
      mode:
        description: dry-run＝只列不改（預設）／execute＝實際寫入
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute
      target:
        description: 「僅 f11」寫哪一邊。sandbox＝拋棄式沙盒（預設）／production＝正式庫
        required: false
        default: sandbox
        type: choice
        options:
          - sandbox
          - production
      path_mode:
        description: 「僅 f11」升級路徑。auto＝由年級自動判定（預設）
        required: false
        default: auto
        type: choice
        options:
          - auto
          - A
          - B
      new_class:
        description: 「僅 f11」新班級名稱（路徑 B 必填，如「五年四班」）
        required: false
        default: ""
        type: string
      backup_done:
        description: 「僅 f11 + production + execute」Notion 全庫匯出備份是否已完成
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
      seat:
        description: 「僅 f27」只處理此座號（留空＝全班）
        required: false
        default: ""
        type: string
      week:
        description: 「僅 f29」要補結的週次標籤（逐字等於 weeks.json 的「標籤」，如 四上第1週(8/31-9/4)）
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 執行 ${{ inputs.task }}（${{ inputs.mode }}）
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          MODE: ${{ inputs.mode }}
          TARGET: ${{ inputs.target }}
          PATH_MODE: ${{ inputs.path_mode }}
          NEW_CLASS: ${{ inputs.new_class }}
          BACKUP_DONE: ${{ inputs.backup_done }}
          SEAT: ${{ inputs.seat }}
          WEEK_LABEL: ${{ inputs.week }}
          TASK_CHOICE: ${{ inputs.task }}
        run: |
          # 選單值帶了狀態前綴與說明（例：「[常用] f28-…（清死關聯・全庫）」），
          # 這裡只抽出 fNN-xxx 當檔名——前綴是給老師看的，不是檔名的一部分。
          NAME=$(printf '%s' "$TASK_CHOICE" | grep -oE 'f[0-9]{2}-[a-z0-9-]+' | head -1)
          if [ -z "$NAME" ] || [ ! -f "scripts/classos/$NAME.mjs" ]; then
            echo "❌ 選項解析不出腳本名或檔案不存在：$TASK_CHOICE"; exit 1
          fi
          echo "▶️ 執行 scripts/classos/$NAME.mjs（mode=$MODE）"
          node "scripts/classos/$NAME.mjs"
