name: ClassOS Phase F 工具

# 學年升級精靈的批次操作入口（SPEC_學年升級 §3：走 Node ＋ Notion 官方 API）。
# 僅手動觸發，且預設 dry-run —— 要實際寫入必須明確把 mode 選成 execute。
# NOTION_TOKEN 只存在 GitHub Secret，不外流（Token 持有原則見 SPEC §3）。
on:
  workflow_dispatch:
    inputs:
      task:
        description: 要執行的任務
        required: true
        type: choice
        options:
          - f01-purge-test-data
          - f02-add-year-field
          - f03-backfill-year
          - f04-unpublish-mock-reports
          - f05-test-failloud
          - f10-sandbox
          - f11-upgrade-wizard
          - f12-simulate-skill-writes
          - f13-fill-contactbook
          - f14-purge-mock-data
          - f20-import-daily-plan
          - f21-relink-daily-plan
          - f22-renumber-review-rounds
          - f23-settle-week1
      mode:
        description: dry-run＝只列不改（預設）／execute＝實際寫入
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute
      target:
        description: 「僅 f11」寫哪一邊。sandbox＝拋棄式沙盒（預設）／production＝正式庫
        required: false
        default: sandbox
        type: choice
        options:
          - sandbox
          - production
      path_mode:
        description: 「僅 f11」升級路徑。auto＝由年級自動判定（預設）
        required: false
        default: auto
        type: choice
        options:
          - auto
          - A
          - B
      new_class:
        description: 「僅 f11」新班級名稱（路徑 B 必填，如「五年四班」）
        required: false
        default: ""
        type: string
      backup_done:
        description: 「僅 f11 + production + execute」Notion 全庫匯出備份是否已完成
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 執行 ${{ inputs.task }}（${{ inputs.mode }}）
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          MODE: ${{ inputs.mode }}
          TARGET: ${{ inputs.target }}
          PATH_MODE: ${{ inputs.path_mode }}
          NEW_CLASS: ${{ inputs.new_class }}
          BACKUP_DONE: ${{ inputs.backup_done }}
        run: node scripts/classos/${{ inputs.task }}.mjs
