name: R18 事件包入庫（f35）

# 規格：ClassOS_v3.5_藍圖/SPEC_R18事件包入庫腳本.md
# 2026-09-25 起＝§5 第 4 步「已切換」：排程跑 execute，R18 事件包由本腳本入庫；
# 雲端 routine 的 R18 列已改「略過，不認領」——同一時間只有一邊寫（U44）。
# 週五週結（weekly-settle.yml）第一步也會先跑一次 execute，兩邊共用 concurrency 群組 cm-events，不會同時認領同一件。
# 回滾：排程改回 compare＋雲端 prompt 貼回 07 附錄的 R18 原文（SPEC §7）。
on:
  schedule:
    # 平日 08:05–17:05 台北＝00:05–09:05 UTC，每小時一次（錯開 routine 的整點；GitHub cron 可能延遲 5–30 分）
    - cron: "5 0-9 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: execute＝立刻入庫待處理的 R18（不必等整點）／dry-run＝只算不寫／compare＝逐欄對照紀錄庫已寫的列／sandbox＝一次性沙盒實跑（建→跑→驗→刪）
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute
          - compare
          - sandbox
      from:
        description: compare 回溯起日 yyyy-mm-dd（依事件包日期；空白＝最近 7 天）
        required: false
        default: ""
        type: string
      to:
        description: compare 回溯迄日 yyyy-mm-dd（空白＝今天）
        required: false
        default: ""
        type: string

concurrency:
  group: cm-events
  cancel-in-progress: false

jobs:
  f35:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 規則測試（sim，不連 Notion）
        run: node scripts/classos/sim/cm-events.mjs
      - name: f35
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          MODE: ${{ github.event_name == 'schedule' && 'execute' || (inputs.mode == 'sandbox' && 'execute' || inputs.mode) }}
          SANDBOX: ${{ inputs.mode == 'sandbox' && '1' || '0' }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: node scripts/classos/f35-cm-events.mjs
