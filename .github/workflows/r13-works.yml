name: R13 作品入庫（f37）

# 規格：ClassOS_v3.5_藍圖/SPEC_R13作品入庫腳本.md
# 2026-09-29 切換：代理 v2.10 送出作品後立刻丟 r13-submit（約 1 分鐘內入庫）；雲端 routine 手冊 R13 已改「略過，不認領」——同一時間只有一邊寫（U44）。
# 整點排程只是備援（GitHub 排程常延遲或丟掉）。回滾：拿掉 repository_dispatch 與 schedule，手冊 R13 貼回停待審（SPEC §6）。
on:
  repository_dispatch:
    types: [r13-submit]
  schedule:
    # 備援：平日 08:15–17:15 台北＝00:15–09:15 UTC（錯開 routine 整點與 f35 的 :05）
    - cron: "15 0-9 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run＝只算不寫／execute＝立刻入庫待處理的 R13／sandbox＝一次性沙盒實跑（建→跑→驗→刪）
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute
          - sandbox

concurrency:
  group: r13-works
  cancel-in-progress: false

jobs:
  f37:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 規則測試（sim，不連 Notion）
        run: node scripts/classos/sim/r13-works.mjs
      - name: f37
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'repository_dispatch') && 'execute' || (inputs.mode == 'sandbox' && 'execute' || inputs.mode) }}
          SANDBOX: ${{ inputs.mode == 'sandbox' && '1' || '0' }}
        run: node scripts/classos/f37-r13-works.mjs
