name: 週五週結試算

# 週結試算的唯一正本。結果停在「📥 任務收件匣」的待審任務等老師確認。
# **這支永遠不寫班級銀行帳本**——只算、只留摘要；真正入帳走 Claude Code 的 /class-bank 週結。
# 之所以不直接入帳：批次動錢一律要人點頭（通用鐵則 5），且新流程要先手動跑幾輪 PDCA（通用鐵則 1）。
#
# ⏰ 2026-09-04 起「自己排 16:00」改成「由週五 15:00 的自動收尾觸發」，全週只跑這一次：
#    本機排程任務 friday-weekly-closeout 先把收件匣清乾淨（沒入庫的紀錄會讓金幣算少），
#    再 `gh workflow run weekly-settle.yml -f mode=execute`。
#    **原本的 16:00 cron 已移除**——同一件事跑兩次只會產生兩份要對照的數字。
#    要手動補跑：Actions 上按 Run workflow，或在 Claude Code 說「跑週結試算」。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run＝只印不建任務／execute＝建立待審任務
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute

jobs:
  settle-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 週結試算
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # 週五收尾會帶 -f mode=execute（真的建待審任務）；手動 Run workflow 時照選單，預設 dry-run。
          MODE: ${{ github.event.inputs.mode || 'execute' }}
        run: node scripts/classos/f24-weekly-settle-preview.mjs
