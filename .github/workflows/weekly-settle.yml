name: 週五週結試算

# 週結試算的唯一正本。結果停在「📥 任務收件匣」的待審任務等老師確認。
# **這支永遠不寫班級銀行帳本**——只算、只留摘要；真正入帳走 Claude Code 的 /class-bank 週結。
# 之所以不直接入帳：批次動錢一律要人點頭（通用鐵則 5），且新流程要先手動跑幾輪 PDCA（通用鐵則 1）。
#
# ⏰ 2026-09-04 起「自己排 16:00」改成「由週五 15:00 的自動收尾觸發」，全週只跑這一次：
#    本機排程任務 friday-weekly-closeout 先把收件匣清乾淨（沒入庫的紀錄會讓金幣算少），
#    再 `gh workflow run weekly-settle.yml -f mode=execute`。
#    **原本的 16:00 cron 已移除**——同一件事跑兩次只會產生兩份要對照的數字。
#    要手動補跑：Actions 上按 Run workflow，或在 Claude Code 說「跑週結試算」。
on:
  # 週五 14:45（台北）＝ 06:45 UTC——排在本機排程 friday-1-reports（14:13 清完收件匣）之後、
  # friday-3-checklist（14:54 總檢查）之前，三者接力剛好在 15:00 前全部就緒。2026-09-12 恢復排程（老師回報「週五 15:00 什麼都沒自己跑」）：
  # 原本靠本機 Claude 排程 friday-weekly-closeout 觸發，但那支不在現在這台電腦上，
  # 等於週結試算與健檢都要老師自己記得跑。機器做得到的事不該綁在「電腦有沒有開」。
  # 收件匣由雲端 routine 平日每小時清（最後一輪 14:00），所以 14:30 算的時候通常已清完；
  # f24 冪等，本機排程若也跑只會刷新同一筆待審，不會疊第二張單子。
  schedule:
    - cron: "45 6 * * 5"
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run＝只印不建任務／execute＝建立待審任務
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute
      as_of:
        description: 回溯試算的日期 yyyy-mm-dd（空白＝今天；**只在 dry-run 生效**，用來對帳「第N週應該發多少」）
        required: false
        default: ""
        type: string

jobs:
  settle-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 週結試算
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # 週五收尾會帶 -f mode=execute（真的建待審任務）；手動 Run workflow 時照選單，預設 dry-run。
          MODE: ${{ github.event.inputs.mode || 'execute' }}
          F24_TODAY: ${{ github.event.inputs.as_of }}
        run: node scripts/classos/f24-weekly-settle-preview.mjs

      # 健檢紅燈要自己跑到老師眼前（收件匣），沒人會去翻 Actions log。全綠就不建列。
      - name: 系統健檢 → 有紅燈才進收件匣
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'execute' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/classos/f30-health-to-inbox.mjs
