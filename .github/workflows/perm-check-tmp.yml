# 一次性：確認 NOTION_TOKEN 對 🏪 商店／📣 公告有無「更新／新增」權限（零寫入）。驗完即刪。
# 手法：送一個不存在的欄位——有權限回 400 validation_error（Notion 先驗權限再驗欄位，不會寫入）；沒權限回 403/404。
name: perm-check-tmp
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 權限檢查（零寫入）
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          node --input-type=module -e '
          const H={Authorization:`Bearer ${process.env.NOTION_TOKEN}`,"Notion-Version":"2022-06-28","Content-Type":"application/json"};
          const api=async(m,p,b)=>{const r=await fetch("https://api.notion.com/v1"+p,{method:m,headers:H,body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));return {s:r.status,code:j.code||"",id:j.results?.[0]?.id,msg:(j.message||"").slice(0,90)};};
          const bad={"__perm_check_不存在的欄位__":{number:1}};
          for (const [n,db] of [["商店","9e421ad0-0312-423d-b870-867b019b23d8"],["公告","d113e3bb-23e5-4528-8125-cc6d9ec9834e"]]){
            const g=await api("GET","/databases/"+db); console.log(n,"讀DB",g.s,g.code);
            const q=await api("POST","/databases/"+db+"/query",{page_size:1}); console.log(n,"查詢",q.s,q.code);
            const u=await api("PATCH","/pages/"+q.id,{properties:bad}); console.log(n,"更新(假欄位)",u.s,u.code,u.msg);
            const c=await api("POST","/pages",{parent:{database_id:db},properties:bad}); console.log(n,"新增(假欄位)",c.s,c.code,c.msg);
          }'
