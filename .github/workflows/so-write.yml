name: 自學星圖 題本寫入 Notion

# 題本資料包（知識點／盲點／故事卡／題目／觀念複習卡／題本結構 JSON）批次寫進 Notion，資料不經 AI context。
# 本機先跑 scripts/classos/study-orbit/write/local.mjs pack：加密資料包推到 so-payload 分支（私有內容不以明文進公開 repo）。
# 僅手動觸發，預設 dry-run —— 要實際寫入必須選 execute，並填 dry-run 印出的資料包指紋（審過的才是寫進去的）。
# NOTION_TOKEN、SO_PAYLOAD_KEY 只在 GitHub Secret。寫入一律「待審」（卡片「草稿」），改「可用」由老師決定。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run＝只查重、轉換、列筆數（預設）／execute＝實際寫入
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute
      fingerprint:
        description: 「execute 必填」dry-run 印出的資料包指紋（8 碼）
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: so-write
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 離線測試（屬性轉換、寫入順序、查重、加解密）
        run: node --test scripts/classos/study-orbit/write/*.test.mjs

      - name: 取加密資料包（so-payload 分支）
        run: |
          git fetch --depth=1 origin so-payload
          git show FETCH_HEAD:payload.bin > "$RUNNER_TEMP/payload.bin"
          echo "資料包 commit：$(git log -1 --format='%h %s' FETCH_HEAD)"

      - name: 寫入（${{ inputs.mode }}）
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SO_PAYLOAD_KEY: ${{ secrets.SO_PAYLOAD_KEY }}
          MODE: ${{ inputs.mode }}
          FINGERPRINT: ${{ inputs.fingerprint }}
          PAYLOAD: ${{ runner.temp }}/payload.bin
        run: node scripts/classos/study-orbit/write/run.mjs

      # 只有頁面 id 與筆數，沒有題目內容；本機 local.mjs merge 併回 ids.json
      - name: 上傳新 id
        if: always() && hashFiles('out/so-write/*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: so-write
          path: out/so-write/*.json
          retention-days: 7
